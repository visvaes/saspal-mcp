[project]
name = "saspal-mcp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "google-auth==2.59.0",
    "google-auth-oauthlib==1.4.1",
    "google-api-python-client==2.200.0",
    "mcp==2.2.0",
    "python-dotenv==1.2.3",
    "openai==3.22.1",
    "httpx>=0.27,<1",
    "pwdlib[argon2]>=0.2,<1",
    "email-validator>=2.1,<3",
    "cryptography>=44,<47",
    "psycopg[binary]>=3.2,<4",
]

[tool.vercel]
entrypoint = "web_app:app"

[tool.uv]
package = false
