<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f6f3">
  <title>Connect Gmail | SASPAL Mail</title>
  <link rel="stylesheet" href="/static/auth.css">
  <script src="/static/auth.js" defer></script>
</head>
<body>
  <main class="auth-layout">
    <a class="auth-brand" href="/" aria-label="SASPAL Mail home"><span class="brand-mark">S</span><span>SASPAL<span class="brand-divider">/</span>MAIL</span></a>
    <section class="auth-panel" aria-labelledby="connect-gmail-title">
      <div class="auth-kicker">GMAIL ACCESS</div>
      <h1 id="connect-gmail-title">Connect Gmail</h1>
      <div class="auth-warning" role="alert">
        <strong>Gmail access required.</strong> Connect your account before the app can read, search, or send mail on your behalf.
      </div>
      <p class="auth-subtitle">This is the approval step that lets the app access your mailbox.</p>
      <form data-auth-form="connect-gmail" novalidate>
        <p class="auth-message" role="status" aria-live="polite"></p>
        <button class="auth-submit" type="submit">Connect Gmail &amp; continue</button>
      </form>
      <p class="auth-switch"><a href="/">Skip for now</a></p>
    </section>
    <footer class="auth-footer">SASPAL MAIL <span>·</span> SECURE ACCESS</footer>
  </main>
</body>
</html>
