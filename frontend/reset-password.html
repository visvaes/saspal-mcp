<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f6f3">
  <title>Choose a new password | SASPAL Mail</title>
  <link rel="stylesheet" href="/static/auth.css">
  <script src="/static/auth.js" defer></script>
</head>
<body>
  <main class="auth-layout">
    <a class="auth-brand" href="/login" aria-label="SASPAL Mail sign in"><span class="brand-mark">S</span><span>SASPAL<span class="brand-divider">/</span>MAIL</span></a>
    <section class="auth-panel" aria-labelledby="auth-title">
      <div class="auth-kicker">ACCOUNT RECOVERY</div>
      <h1 id="auth-title">Choose a new password</h1>
      <p class="auth-subtitle">Use at least 12 characters.</p>
      <form data-auth-form="reset" novalidate>
        <label class="auth-field"><span>New Password</span><input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label>
        <label class="auth-field"><span>Confirm Password</span><input name="password_confirmation" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label>
        <p class="auth-message" role="status" aria-live="polite"></p>
        <button class="auth-submit" type="submit">Update Password</button>
      </form>
      <p class="auth-switch"><a href="/login">Back to Sign In</a></p>
    </section>
    <footer class="auth-footer">SASPAL MAIL <span>·</span> SECURE ACCESS</footer>
  </main>
</body>
</html>
